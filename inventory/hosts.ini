# Placeholder inventory - deploys to this same machine via
# ansible_connection=local, matching the pattern used across this user's
# other Ansible+Jenkins projects (gitlab-backup-with-jenkins-ansible,
# CockroachDB-Cluster).
#
# For a real target, replace with:
#   [postgres]
#   pg01 ansible_host=10.0.1.20
#
# Jenkins can point ACTION at any host in this file, or a different
# inventory entirely, via -i - "deploy to any destination" just means
# adding/pointing at the right inventory host, no code changes.

[postgres]
localhost ansible_connection=local
