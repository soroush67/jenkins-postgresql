---
# Full image references, not a registry-prefix var like this user's other
# projects (CockroachDB-Cluster, gitlab-backup-with-jenkins-ansible) -
# their internal registry doesn't just prefix the public image path for
# postgres-exporter (docker-hosted.hamainsurance.net/postgres-exporter,
# not .../prometheuscommunity/postgres-exporter), so a prefix-only
# substitution wouldn't work here. Override the whole var for local
# testing instead, e.g.:
#   -e pg_postgres_image=postgres:18.4-alpine3.22
#   -e pg_exporter_image=prometheuscommunity/postgres-exporter:v0.18.1
pg_postgres_image: "docker-hosted.hamainsurance.net/postgres:18.4-alpine3.22"
pg_exporter_image: "docker-hosted.hamainsurance.net/postgres-exporter:v0.18.1"

# Where this REPO's own checkout lives - only ever used to locate
# templates/*.j2 (the template *sources* always ship with the repo,
# regardless of where the deployed stack itself ends up). Never used for
# deployed artifacts - see pg_deploy_path below, which is a genuinely
# different concern once it points somewhere other than the Jenkins
# workspace.
pg_project_root: "{{ playbook_dir }}/.."

# Where docker-compose.yml + data/config/init/logs actually get created
# on the target host - defaults to pg_project_root (so local/manual
# testing needs no extra flag), but is the one thing meant to be
# overridden per real deployment (Jenkins: DEPLOY_PATH, passed as
# -e pg_deploy_path=...). Everything this role creates lives under this
# ONE path and nothing else - no per-host subdirectory, no path derived
# from anywhere but this variable.
pg_deploy_path: "{{ pg_project_root }}"

# Matches the original hand-written stack's own relative layout
# (config/, init/, data/, logs/ next to the compose file).
pg_data_root: "{{ pg_deploy_path }}/data"
pg_config_root: "{{ pg_deploy_path }}/config"
pg_logs_root: "{{ pg_deploy_path }}/logs"
pg_init_root: "{{ pg_deploy_path }}/init"

# PRODUCTION: point pg_data_root at a real, dedicated disk mount and set
# this true - see roles/preflight, which then refuses to deploy unless
# it's a genuine separate mountpoint. Off by default (this sandbox has
# no second disk), same convention as CockroachDB-Cluster.
pg_require_dedicated_mount: false

pg_container_name: "postgresql"
pg_exporter_container_name: "pg-exporter"

pg_db: "appdb"
pg_user: "appuser"
# Must be set via -e / Ansible Vault / a Jenkins credential binding -
# never committed. Deploy fails cleanly (roles/postgres asserts this) if
# left empty.
pg_password: ""

# Was "pg_exporter" in the original init/01-create-exporter-user.sql but
# "postgres_exporter" in docker-compose.yml's own DATA_SOURCE_NAME - a
# real mismatch that would have made the exporter fail to authenticate
# on first boot (confirmed by reading both files; never actually ran
# successfully together). Standardized on postgres_exporter here - both
# the rendered init SQL and the compose file's connection string now
# come from this one variable, so they can't drift again.
pg_exporter_user: "postgres_exporter"
pg_exporter_password: ""

pg_port: 5432
pg_exporter_port: 9187

pg_timezone: "Asia/Tehran"
pg_max_connections: 100
pg_shared_buffers: "256MB"

# The postgres image's own built-in non-root user - confirmed directly
# (`getent passwd postgres` inside postgres:18.4-alpine3.22 → uid/gid
# 70). Used for both the compose `user:` directive and chowning
# pg_data_root, so the container never needs to run as root at all (no
# gosu/chown-as-root dance, no CAP_CHOWN/CAP_SETUID needed) - re-verify
# this value if the base image's major Alpine version ever changes.
pg_run_uid: 70
pg_run_gid: 70
# postgres-exporter's own built-in non-root user (confirmed directly:
# uid/gid 65534, "nobody").
pg_exporter_run_uid: 65534
pg_exporter_run_gid: 65534

# host all all <this>: the original file had 0.0.0.0/0 (fully open,
# password-required) alongside a published port - kept as the default
# here since that appears to be an intentional "reachable from outside
# this host" design (not touched without being asked), but is now
# configurable. Narrow this to a real CIDR if external reach was never
# actually intended.
pg_hba_allowed_cidr: "0.0.0.0/0"

# external: true in the compose file - must already exist on the
# target host. roles/preflight creates them if missing (idempotent),
# rather than requiring a separate manual step.
pg_networks:
  - back-net
  - db-net

pg_mem_limit: "1024m"
pg_mem_reservation: "128m"
pg_cpus: "0.5"
