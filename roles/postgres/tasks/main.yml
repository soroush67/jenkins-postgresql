---
# Permission strategy (checked directly, not guessed - see the root
# README's Design notes for the real mistake this replaced): Ansible
# itself always runs unprivileged (become: false, matching this user's
# other Ansible+Jenkins projects) and can never chown a path to a uid it
# doesn't own. Two different fixes are needed depending on whether the
# postgres image's own uid (70) needs to WRITE into a path or just READ
# it:
#   - pg_data_root / pg_logs_root (read-write mounts): created once and
#     handed over to uid 70 entirely (owner+mode via a throwaway
#     container) - and never touched again by Ansible afterward, checked
#     via `stat` first, since re-chowning an already-handed-over
#     directory on every rerun would eventually lock this deploying user
#     out of even listing it (confirmed directly: a first attempt
#     `chown -R` on the top-level directories broke `ls` and every
#     subsequent Ansible run on the *directories themselves*, not just
#     their contents).
#   - config/init (read-only mounts): directories stay owned by this
#     deploying user with mode 0751 (owner: full, other: traverse-only,
#     no listing) - traverse-only is enough for uid 70/65534 to open a
#     specific file by its exact bind-mounted path without needing
#     ownership of the directory at all. Files with no secrets
#     (postgresql.conf, pg_hba.conf, postgres_exporter.yml) are then
#     just world-readable (0644). The one file that DOES hold a secret
#     (the exporter-user init SQL) is instead chowned to uid 70 with
#     0400 (owner-read-only) via the same throwaway-container trick,
#     removed and re-rendered on every run first so a changed
#     pg_exporter_password doesn't get stuck behind its own previous
#     0400 lockout.

- name: Ensure the deploy path itself exists
  # In case pg_deploy_path is a fresh directory (e.g. a real DEPLOY_PATH
  # that's never been used before) - `file: state: directory` on the
  # subdirectories below would create this as an implicit parent anyway,
  # but doing it explicitly here gives a clearer failure if this
  # deploying user can't write to pg_deploy_path's own parent (e.g. an
  # unwritable /opt) than a confusing failure three tasks later.
  file:
    path: "{{ pg_deploy_path }}"
    state: directory
    mode: "0755"

- name: Ensure the read-only config/init directories exist (traversable by the container, not owned by it)
  # 0755, not 0751 - the postgres entrypoint script `ls`'s
  # /docker-entrypoint-initdb.d/ to discover init scripts, which needs
  # LIST (read) permission on the directory itself, not just traverse.
  # Confirmed directly: 0751 alone left postgres unable to even list the
  # directory ("ls: can't open '/docker-entrypoint-initdb.d/': Permission
  # denied"), independent of the init SQL file's own 0400 lockdown below
  # (which still protects its *contents* even though its *filename* is
  # now visible via listing).
  file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ pg_config_root }}"
    - "{{ pg_config_root }}/postgres-exporter"
    - "{{ pg_init_root }}"
  loop_control:
    label: "{{ item }}"

- name: Render postgresql.conf (world-readable - no secrets)
  template:
    src: "{{ pg_project_root }}/templates/postgresql.conf.j2"
    dest: "{{ pg_config_root }}/postgresql.conf"
    mode: "0644"

- name: Render pg_hba.conf (world-readable - no secrets)
  template:
    src: "{{ pg_project_root }}/templates/pg_hba.conf.j2"
    dest: "{{ pg_config_root }}/pg_hba.conf"
    mode: "0644"

- name: Render pg_ident.conf (world-readable - just a username mapping, no secrets)
  template:
    src: "{{ pg_project_root }}/templates/pg_ident.conf.j2"
    dest: "{{ pg_config_root }}/pg_ident.conf"
    mode: "0644"

- name: Render postgres_exporter.yml (world-readable - no secrets)
  template:
    src: "{{ pg_project_root }}/templates/postgres_exporter.yml.j2"
    dest: "{{ pg_config_root }}/postgres-exporter/postgres_exporter.yml"
    mode: "0644"

- name: Remove any previous init SQL before re-rendering
  # It may be owned by uid 70 mode 0400 from a previous run (see below) -
  # this deploying user couldn't overwrite it directly if
  # pg_exporter_password changed, so always clear it first via the same
  # throwaway-container trick, then render fresh every time.
  command: >-
    docker run --rm -v {{ pg_init_root }}:/target
    --entrypoint rm
    {{ pg_postgres_image }}
    -f /target/01-create-exporter-user.sql
  changed_when: true

- name: Render the exporter-user init SQL (still owned by this deploying user for now)
  template:
    src: "{{ pg_project_root }}/templates/01-create-exporter-user.sql.j2"
    dest: "{{ pg_init_root }}/01-create-exporter-user.sql"
    mode: "0600"

- name: Lock the exporter-user init SQL down to the postgres image's own uid
  # 0400, owner-read-only - contains pg_exporter_password in plaintext.
  command: >-
    docker run --rm -v {{ pg_init_root }}:/target
    --entrypoint sh
    {{ pg_postgres_image }}
    -c "chown {{ pg_run_uid }}:{{ pg_run_gid }} /target/01-create-exporter-user.sql && chmod 0400 /target/01-create-exporter-user.sql"
  changed_when: true

- name: Render docker-compose.yml
  # Directly in pg_deploy_path - no per-host/extra subdirectory.
  # pg_deploy_path (Jenkins: DEPLOY_PATH) pins this to exactly one
  # directory with nothing created outside it - defaults to
  # pg_project_root (the repo checkout) when not overridden, so
  # local/manual testing needs no extra flag.
  template:
    src: "{{ pg_project_root }}/templates/docker-compose.yml.j2"
    dest: "{{ pg_deploy_path }}/docker-compose.yml"
    mode: "0640"

- name: Ensure the volumes root exists
  # /data/<last folder of pg_deploy_path> - a plain, soroush-owned
  # directory (0755). Only the data/logs subdirectories beneath it get
  # handed over to uid 70 individually, below - this directory itself
  # never needs to be, so no lockout risk here (unlike a bare `-v` mount
  # trick, which would leave Docker's own auto-created parent dir
  # root-owned instead).
  file:
    path: "{{ pg_volumes_root }}"
    state: directory
    mode: "0755"

- name: Check whether the data directory already exists
  stat:
    path: "{{ pg_data_root }}"
  register: pg_data_dir_stat

- name: Create and hand over the data directory to the postgres image's own uid (only on first deploy)
  # Handed over entirely (owner uid 70, mode 0700) and never touched
  # again afterward - this deploying user only ever needs to confirm it
  # EXISTS (the stat above, which needs no permission on the target
  # itself, only its parent) on subsequent runs, not manage its
  # contents.
  command: >-
    docker run --rm -v {{ pg_volumes_root }}:/project
    --entrypoint sh
    {{ pg_postgres_image }}
    -c "mkdir -p /project/data && chown {{ pg_run_uid }}:{{ pg_run_gid }} /project/data && chmod 0700 /project/data"
  changed_when: true
  when: not pg_data_dir_stat.stat.exists

- name: Check whether the logs directory already exists
  stat:
    path: "{{ pg_logs_root }}"
  register: pg_logs_dir_stat

- name: Create and hand over the logs directory to the postgres image's own uid (only on first deploy)
  command: >-
    docker run --rm -v {{ pg_volumes_root }}:/project
    --entrypoint sh
    {{ pg_postgres_image }}
    -c "mkdir -p /project/logs && chown {{ pg_run_uid }}:{{ pg_run_gid }} /project/logs && chmod 0700 /project/logs"
  changed_when: true
  when: not pg_logs_dir_stat.stat.exists

- name: Start (or reconcile) postgres + postgres_exporter
  command: "{{ pg_compose_cmd }} -f {{ pg_deploy_path }}/docker-compose.yml up -d"
  args:
    chdir: "{{ pg_deploy_path }}"
  changed_when: true

- name: Wait for postgres to become healthy
  command: >-
    docker inspect --format="{{ '{{' }}.State.Health.Status{{ '}}' }}" {{ pg_container_name }}
  register: pg_health_check
  until: pg_health_check.stdout == "healthy"
  retries: 24
  delay: 5
  changed_when: false

- name: Sync appuser's and the exporter role's passwords with the currently declared secrets
  # docker-entrypoint-initdb.d scripts (including the init SQL rendered
  # above) only ever run once, against a genuinely empty data directory -
  # a redeploy with a changed pg_password/pg_exporter_password would
  # otherwise silently desync from the actual DB roles' passwords.
  #
  # Connects via `docker exec --user postgres` (no -h, so psql defaults
  # to the local unix socket) - NOT `-e PGPASSWORD=...` over TCP, which
  # requires already knowing appuser's CURRENT password to authenticate
  # at all. Confirmed for real: a redeploy against an existing data
  # directory with a changed pg_password failed outright ("password
  # authentication failed for user \"appuser\""), since appuser is the
  # ONLY superuser here (POSTGRES_USER=appuser removes the default
  # "postgres" role too) - there was no account left to reset it with.
  # pg_hba.conf's `local` rule is `peer map=pgmap` (see
  # templates/pg_ident.conf.j2) specifically to make this possible
  # without reintroducing `trust`: peer still requires the connecting
  # process to actually BE this exact container's own "postgres" OS
  # user, i.e. `docker exec` access to this specific container - not
  # "any local host user" the way `trust` was.
  command: >-
    docker exec --user postgres
    {{ pg_container_name }}
    psql -U {{ pg_user }} -d {{ pg_db }}
    -c "ALTER USER {{ pg_user }} WITH PASSWORD '{{ pg_password }}'; ALTER USER {{ pg_exporter_user }} WITH PASSWORD '{{ pg_exporter_password }}';"
  changed_when: true

- name: Wait for postgres_exporter to become healthy
  command: >-
    docker inspect --format="{{ '{{' }}.State.Running{{ '}}' }}" {{ pg_exporter_container_name }}
  register: pg_exporter_running_check
  until: pg_exporter_running_check.stdout == "true"
  retries: 12
  delay: 5
  changed_when: false

- name: Verify postgres_exporter can actually reach and authenticate to postgres
  # Proves the username fix and network fix both actually work, not just
  # that both containers started - /metrics only returns real
  # pg_up-style data if the exporter's own DB connection succeeded.
  uri:
    url: "http://127.0.0.1:{{ pg_exporter_port }}/metrics"
    return_content: true
  register: pg_exporter_metrics
  until: "'pg_up 1' in pg_exporter_metrics.content"
  retries: 12
  delay: 5

- name: Report deployment complete
  debug:
    msg: >-
      postgres: healthy (port {{ pg_port }}). postgres_exporter: authenticated
      and scraping (port {{ pg_exporter_port }}/metrics, pg_up 1).
